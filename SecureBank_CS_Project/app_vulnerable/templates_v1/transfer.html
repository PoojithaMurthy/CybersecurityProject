{% extends "base.html" %}{% set active='transfer' %}{% block title %}Transfer{% endblock %}
{% block body %}<div class="topline"><h1>Transfer money</h1>
  <div class="hi">Balance: &#8377; {{ '{:,.2f}'.format(u['balance']) }}</div></div>
{% if error %}<div class="flash err">{{ error }}</div>{% endif %}
<div class="card" style="max-width:480px">
  <form method="post"><label>Pay to</label>
    <select name="payee">{% for p in payees %}<option>{{ p['name'] }} ({{ p['acc_no'] }})</option>{% endfor %}</select>
    <label>Amount (&#8377;)</label><input name="amount" type="number" min="1" placeholder="0">
    <button class="btn block" style="margin-top:20px">Send money</button></form>
</div>{% endblock %}
